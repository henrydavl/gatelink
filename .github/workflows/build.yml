name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]        # pushing a tag like v2.0.0 publishes a Release
  pull_request:
  workflow_dispatch:   # allow manual runs from the Actions tab

# Actions are pinned to commit hashes: release files reach every Mac through
# the in-app updater and are installed as root, so a moved tag must not change them.
permissions:
  contents: read

jobs:
  # Unit tests for GateLinkKit (OTP, vault, PTY login, session state machine)
  # and a syntax check of the shell scripts that run as root.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test GateLinkKit
        run: swift test --package-path GateLinkKit
      - name: Check shell scripts
        run: |
          for f in scripts/*.sh scripts/gatelink-tunnel scripts/pkg/*install; do bash -n "$f"; done
      - name: Test the tunnel wrapper lifeline
        run: ./scripts/test-gatelink-tunnel.sh

  # Build the macOS app for both CPU architectures. The bundled OpenConnect
  # engine is compiled from pinned sources with -mmacosx-version-min=14.0, so
  # the newer runners (macOS 15/26) do not raise the app's minimum OS.
  build-macos:
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            pkg: GateLink-arm64.pkg
          - runner: macos-15-intel
            arch: x64
            pkg: GateLink-x64.pkg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The SDK sets the look: macOS 26 draws apps built with an older SDK in the old style.
      - name: Use Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Compute version from tag
        id: ver
        run: |
          v="${{ github.ref_name }}"; v="${v#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
      - name: Install build tools
        run: |
          command -v pkg-config >/dev/null || brew install pkg-config
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build OpenConnect engine (macOS 14 deployment target)
        env:
          GATELINK_ENGINE_PREFIX: ${{ runner.temp }}/gatelink-engine
        run: ./scripts/build-openconnect-engine.sh
      - name: Bundle OpenConnect into the app
        env:
          GATELINK_ENGINE_PREFIX: ${{ runner.temp }}/gatelink-engine
        run: |
          GATELINK_OPENCONNECT="$GATELINK_ENGINE_PREFIX/sbin/openconnect" \
          GATELINK_EXTRA_PREFIX="$GATELINK_ENGINE_PREFIX" \
          GATELINK_VPNC_SCRIPT="$GATELINK_ENGINE_PREFIX/etc/vpnc/vpnc-script" \
          ./scripts/bundle-openconnect.sh
      - name: Verify bundled openconnect deployment target
        run: |
          MAX=14.0
          fail=0
          for f in Engine/openconnect/openconnect Engine/openconnect/*.dylib; do
            [ -f "$f" ] || continue
            v=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')
            echo "$f minos=$v"
            if [ -z "$v" ]; then echo "ERROR: cannot read minos for $f"; fail=1; continue; fi
            lower=$(printf '%s\n%s\n' "$v" "$MAX" | sort -t. -k1,1n -k2,2n | head -1)
            if [ "$lower" != "$v" ]; then
              echo "ERROR: $f requires macOS $v, runner target is $MAX"
              fail=1
            fi
          done
          # The engine must load with only system + @loader_path deps.
          if otool -L Engine/openconnect/openconnect \
             | tail -n +2 | awk '{print $1}' \
             | grep -vE '^(@loader_path|/usr/lib|/System)' ; then
            echo "ERROR: unbundled absolute dependency"
            exit 1
          fi
          Engine/openconnect/openconnect --version
          exit $fail

      - name: Build .app bundle
        run: ./scripts/build-macos-app.sh
        env:
          GATELINK_VERSION: ${{ steps.ver.outputs.version }}
      - name: Verify the app uses the macOS 26 SDK
        run: |
          sdk=$(otool -l dist/GateLink.app/Contents/MacOS/GateLink | awk '/LC_BUILD_VERSION/{f=1} f && /sdk/{print $2; exit}')
          echo "sdk=$sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "ERROR: built with SDK $sdk; the app would get the old look on macOS 26"; exit 1; }
      - name: Build installer package (app + tunnel helper)
        run: |
          ./scripts/build-macos-pkg.sh
          mv dist/GateLink.pkg "dist/${{ matrix.pkg }}"
      - name: Upload macOS installer (pkg)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GateLink-macos-${{ matrix.arch }}-pkg
          path: dist/${{ matrix.pkg }}
          if-no-files-found: error

  # Compile the iOS app and its tunnel extension so shared code cannot break it
  # unnoticed. Unsigned: a Network Extension needs the owner's paid team.
  build-ios:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Install build tools
        run: |
          command -v pkg-config >/dev/null || brew install pkg-config
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build OpenConnect engine (iOS)
        run: ./scripts/build-openconnect-ios.sh
      - name: Build the iOS app
        run: |
          xcodegen generate --quiet
          xcodebuild -quiet -project GateLink.xcodeproj -scheme GateLinkiOS \
            -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

  # When a version tag (v*) is pushed, publish both installers as a GitHub Release.
  release:
    runs-on: ubuntu-latest
    needs: [ build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/GateLink-macos-arm64-pkg/GateLink-arm64.pkg
            artifacts/GateLink-macos-x64-pkg/GateLink-x64.pkg
          fail_on_unmatched_files: true
          generate_release_notes: true
