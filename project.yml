name: GateLink
options:
  bundleIdPrefix: com.gatelink
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GateLinkKit:
    path: GateLinkKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.8"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GateLink:
    type: application
    platform: macOS
    sources:
      - path: GateLink
        excludes:
          - Resources/logo.svg
    dependencies:
      - package: GateLinkKit
    info:
      path: GateLink/Info.plist
      properties:
        CFBundleDisplayName: GateLink
        CFBundleIconFile: GateLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: One-click login for the GlobalProtect app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatelink.app
        PRODUCT_NAME: GateLink
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
