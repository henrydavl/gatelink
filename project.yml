name: GateLink
options:
  bundleIdPrefix: com.gatelink
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GateLinkKit:
    path: GateLinkKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.4"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GateLink:
    type: application
    platform: macOS
    sources:
      - path: GateLink
        excludes:
          - Resources/logo.svg
      - path: scripts/gatelink-tunnel
        buildPhase: resources
      - path: scripts/install-tunnel-helper.sh
        buildPhase: resources
      - path: scripts/hipreport.sh
        buildPhase: resources
    dependencies:
      - package: GateLinkKit
    info:
      path: GateLink/Info.plist
      properties:
        CFBundleDisplayName: GateLink
        CFBundleIconFile: GateLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: GlobalProtect client built on OpenConnect.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatelink.app
        PRODUCT_NAME: GateLink
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed OpenConnect engine
        basedOnDependencyAnalysis: false
        script: |
          # Copies the engine staged by scripts/bundle-openconnect.sh: the
          # binary and dylibs (already ad-hoc signed) into Contents/Helpers,
          # and vpnc-script into Resources, since Helpers may hold only
          # signed code.
          ENGINE="${SRCROOT}/Engine/openconnect"
          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          DEST="${CONTENTS}/Helpers/openconnect"
          rm -rf "${DEST}" "${CONTENTS}/Resources/vpnc-script"
          if [ -x "${ENGINE}/openconnect" ]; then
            mkdir -p "${DEST}"
            cp "${ENGINE}/openconnect" "${ENGINE}"/*.dylib "${DEST}/"
            cp "${ENGINE}/vpnc-script" "${CONTENTS}/Resources/vpnc-script"
          else
            echo "warning: No OpenConnect engine in Engine/openconnect. Run scripts/bundle-openconnect.sh; the app falls back to Homebrew's openconnect."
          fi
