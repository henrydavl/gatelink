name: GateLink
options:
  bundleIdPrefix: com.gatelink
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GateLinkKit:
    path: GateLinkKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.6"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GateLink:
    type: application
    platform: macOS
    sources:
      - path: GateLink
        excludes:
          - Resources/logo.svg
      - path: scripts/gatelink-tunnel
        buildPhase: resources
      - path: scripts/install-tunnel-helper.sh
        buildPhase: resources
      - path: scripts/hipreport.sh
        buildPhase: resources
    dependencies:
      - package: GateLinkKit
    info:
      path: GateLink/Info.plist
      properties:
        CFBundleDisplayName: GateLink
        CFBundleIconFile: GateLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: GlobalProtect client built on OpenConnect.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatelink.app
        PRODUCT_NAME: GateLink
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed OpenConnect engine
        basedOnDependencyAnalysis: false
        script: |
          # Copies the engine staged by scripts/bundle-openconnect.sh: the
          # binary and dylibs (already ad-hoc signed) into Contents/Helpers,
          # and vpnc-script into Resources, since Helpers may hold only
          # signed code.
          ENGINE="${SRCROOT}/Engine/openconnect"
          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          DEST="${CONTENTS}/Helpers/openconnect"
          rm -rf "${DEST}" "${CONTENTS}/Resources/vpnc-script"
          if [ -x "${ENGINE}/openconnect" ]; then
            mkdir -p "${DEST}"
            cp "${ENGINE}/openconnect" "${ENGINE}"/*.dylib "${DEST}/"
            cp "${ENGINE}/vpnc-script" "${CONTENTS}/Resources/vpnc-script"
          else
            echo "warning: No OpenConnect engine in Engine/openconnect. Run scripts/bundle-openconnect.sh; the app falls back to Homebrew's openconnect."
          fi

  # iOS: the app logs in with libopenconnect and starts GateLinkTunnel, a
  # Packet Tunnel extension that runs the tunnel. Build the engine first with
  # scripts/build-openconnect-ios.sh. Needs a paid team: Apple allows
  # Network Extensions only there. Sideloaded to your own iPhone.
  GateLinkiOS:
    type: application
    configFiles:
      Debug: GateLinkiOS/Signing.xcconfig
      Release: GateLinkiOS/Signing.xcconfig
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: GateLink/App/AppModel.swift
      - path: GateLink/Shared
      - path: GateLinkiOS
        excludes: [Info.plist, "*.entitlements", "*.xcconfig"]
    dependencies:
      - package: GateLinkKit
      - target: GateLinkTunnel
    info:
      path: GateLinkiOS/Info.plist
      properties:
        CFBundleDisplayName: GateLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSFaceIDUsageDescription: GateLink uses Face ID before it reads your 2FA secret and VPN password.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: GateLinkiOS/GateLinkiOS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.example.gatelink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gatelink
        PRODUCT_NAME: GateLink
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: GateLinkiOS/Shared/GateLink-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/ios/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Engine/ios/lib
        OTHER_LDFLAGS: [-lopenconnect, -lssl, -lcrypto, -lxml2, -lz, -liconv, -framework, Security]

  GateLinkTunnel:
    type: app-extension
    configFiles:
      Debug: GateLinkiOS/Signing.xcconfig
      Release: GateLinkiOS/Signing.xcconfig
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: GateLinkTunnel
        excludes: [Info.plist, "*.entitlements"]
      - path: GateLinkiOS/Shared
    info:
      path: GateLinkTunnel/Info.plist
      properties:
        CFBundleDisplayName: GateLink Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: GateLinkTunnel/GateLinkTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.example.gatelink]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gatelink.tunnel
        # NetworkExtension's base class is not concurrency-annotated; Swift 6 mode rejects its overrides.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: GateLinkiOS/Shared/GateLink-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Engine/ios/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Engine/ios/lib
        OTHER_LDFLAGS: [-lopenconnect, -lssl, -lcrypto, -lxml2, -lz, -liconv, -framework, Security]
